<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Jogos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">🎮 Minha Biblioteca de Jogos</h1>
        <a href="/docs" target="_blank" class="btn btn-outline-dark btn-sm">📖 Swagger UI</a>
    </div>

    <!-- Formulário de Adicionar Jogo -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form action="/jogos" method="post" class="row g-2">
                <div class="col-md-5">
                    <input type="text" name="titulo" class="form-control" placeholder="Título do jogo (ex: Elden Ring)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="plataforma" class="form-control" placeholder="Plataforma (PC, PS5, Xbox, Switch...)" required>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de Jogos -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 bg-white">
                <thead class="table-light">
                    <tr>
                        <th>Título</th>
                        <th>Plataforma</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for jogo in jogos %}
                    <tr>
                        <td class="fw-semibold">{{ jogo.titulo }}</td>
                        <td><span class="badge bg-light text-dark border">{{ jogo.plataforma }}</span></td>
                        <td>
                            {% if jogo.concluido %}
                            <span class="badge bg-success">Zerado</span>
                            {% else %}
                            <span class="badge bg-secondary">Jogando</span>
                            {% endif %}
                        </td>
                        <td class="text-end">
                            <form action="/jogos/{{ jogo.id }}/concluir" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">Alternar</button>
                            </form>
                            <form action="/jogos/{{ jogo.id }}/apagar" method="post" class="d-inline ms-1">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Deseja realmente apagar este jogo?')">Apagar</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">Nenhum jogo cadastrado na sua biblioteca.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
